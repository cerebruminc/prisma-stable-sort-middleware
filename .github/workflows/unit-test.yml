name: Unit test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prisma-version: [5, 6, 7]
    name: Prisma ${{ matrix.prisma-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Prisma ${{ matrix.prisma-version }}
        env:
          PRISMA_VERSION: ${{ matrix.prisma-version }}
        run: |
          npm install --no-save --package-lock=false prisma@"$PRISMA_VERSION" @prisma/client@"$PRISMA_VERSION"
      - run: npm test
      - run: npm run build
