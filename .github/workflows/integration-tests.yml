name: Integration testing

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  docker_test:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail -x {0}

    env:
      DOCKER_BUILDKIT: "1"

    strategy:
      fail-fast: false
      matrix:
        prisma-version: [5, 6, 7]

    name: Prisma ${{ matrix.prisma-version }} integration in Docker Compose

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run docker compose tests
        run: |
          npm run test:compose:integration:v${{ matrix.prisma-version }}
