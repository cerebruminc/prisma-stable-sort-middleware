version: "3.7"
networks:
  internal: {}
services:
  sut:
    build:
      context: .
      dockerfile: ./Dockerfile.sut
    profiles:
      - with-sut
      - with-sut-v5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8000:8000
    networks:
      - internal
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/prisma_stable_sort?connection_limit=30

  sut-v6:
    build:
      context: .
      dockerfile: ./test/fixtures/prisma6/Dockerfile
    profiles:
      - with-sut-v6
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/prisma_stable_sort

  sut-v7:
    build:
      context: .
      dockerfile: ./test/fixtures/prisma7/Dockerfile
    profiles:
      - with-sut-v7
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/prisma_stable_sort

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prisma_stable_sort
    ports:
      - 55432:5432
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
